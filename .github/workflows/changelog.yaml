---
name: "Changelog"

# Managed by Copier from https://github.com/iT3E/app-repo-template (see
# .copier-answers.yml). The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows. The template pins that release
# (@<sha> # vX.Y.Z), and a template release moves it here as a
# `copier update` PR.
#
# Every PR adds a Changie fragment (`changie new`), unless it is labeled
# skip-changelog or comes from a dependency bot.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changelog:
    name: changelog
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/changelog.yaml@447a36cf89cd163004fcf7b574955c6c6deb2f92 # v1.9.2
