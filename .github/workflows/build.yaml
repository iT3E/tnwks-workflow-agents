---
name: "Build"

# Managed by Copier from https://github.com/iT3E/app-repo-template (see
# .copier-answers.yml). The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows. The template pins that release
# (@<sha> # vX.Y.Z), and a template release moves it here as a
# `copier update` PR.
#
# python: compileall (plus ruff and tests where enabled).
# image: Docker build on PRs;
# push :<version> and :sha-<short> from a v* tag (release.yaml dispatches
# this workflow on the tags it creates). Never :latest.
on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One run per ref. PR runs cancel each other; main and tag runs queue.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/python.yaml@49f998b9ac2a57f441c9380cce88bfcd9abf7ffa # v1.9.3
    with:
      python-version: "3.13"

  image:
    name: image
    needs: ["python"]
    permissions:
      contents: read
      packages: write
    uses: iT3E/github-workflows/.github/workflows/image.yaml@49f998b9ac2a57f441c9380cce88bfcd9abf7ffa # v1.9.3
    with:
      push-main: false
      privacy-gate: history
      test-command: |
        bin/image-test "$IMAGE_REF"
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
