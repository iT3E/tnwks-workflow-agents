---
name: "Privacy"

# Managed by Copier from https://github.com/iT3E/app-repo-template (see
# .copier-answers.yml). The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows. The template pins that release
# (@<sha> # vX.Y.Z), and a template release moves it here as a
# `copier update` PR.
#
# bin/privacy-check on every tracked file and path, the commits the event
# adds (messages and identities) and the PR title and body, against the
# PRIVACY_TERMS secret (task privacy:sync). A missing secret fails: a
# private repo has no fork PRs. Exceptions: .github/privacy-allow.
on:
  pull_request:
    # edited: a changed title or body is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["main"]
    # The tag's image ships the whole history, so check all of it.
    tags: ["v*"]

permissions: {}

jobs:
  privacy:
    name: privacy
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/privacy.yaml@447a36cf89cd163004fcf7b574955c6c6deb2f92 # v1.9.2
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
