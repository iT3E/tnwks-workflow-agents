---
name: "Actionlint"

# Managed by Copier from https://github.com/iT3E/app-repo-template (see
# .copier-answers.yml). The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows. The template pins that release
# (@<sha> # vX.Y.Z), and a template release moves it here as a
# `copier update` PR.
#
# actionlint (with shellcheck) on the workflows, only when a PR touches them.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"

permissions: {}

jobs:
  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/actionlint.yaml@4968e2ea41429e3b8e9b1e77f41d222a5ea01436 # v1.8.1
