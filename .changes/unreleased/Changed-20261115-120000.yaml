kind: Changed
body: 'The run job reads the Sandbox record of its sandbox through the Kubernetes API after the delete, and a record that stays fails the run (exit 6, with `sandbox_error` in the result). The sweep also lists the run records through the API, and removes each old one that the gateway left or does not list. The run job now needs a token with `list` on `sandboxes` (`agents.x-k8s.io`), and the sweep its own service account with `list` and `delete`: grant them before this release runs.'
