kind: Added
body: 'The run receiver: POST /runs with a token, an agent name from the list in git, an input and the key of the run. It makes one Job from the template of that agent, changes nothing else of it, and gives back the answer. A second call with the same key gets the same run. GET /runs/{key} gives the state of a run'
