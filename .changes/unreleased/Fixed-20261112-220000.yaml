kind: Fixed
body: 'The Renovate reviewer calls the Anthropic Messages API of the model gateway (POST /v1/messages, the route of the agents), sends the effort of each call in output_config (REVIEW_EFFORT, default high), and keeps the history append only (NullConversationManager), so the model bridge carries the effort and matches each call to its conversation. MODEL_ID defaults to agents-workflows, and MODEL_GATEWAY_URL is the root URL of the gateway. The image drops the OpenAI package and adds the Anthropic SDK'
